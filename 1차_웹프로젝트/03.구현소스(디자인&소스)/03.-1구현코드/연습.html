<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- Demo styles -->
    <style>
      html,
      body {
        position: relative;
        height: 100%;
      }

      body {
        background: #000;
        font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
        font-size: 14px;
        color: #fff;
        margin: 0;
        padding: 0;
      }

      .swiper {
        width: 100%;
        height: 100%;
      }

      .swiper-slide {
        text-align: center;
        font-size: 18px;
        background: #444;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      body {
        background: #000;
        color: #000;
      }

      .swiper {
        width: 100%;
        height: 300px;
        margin-left: auto;
        margin-right: auto;
      }

      .swiper-slide {
        background-size: cover;
        background-position: center;
      }

      .mySwiper2 {
        height: 460px;
        width: 558px;
      }

      .mySwiper {
        height: 50px;
        width: 558px;
        padding: 20px 0;
      }

      .mySwiper .swiper-slide {
        /* width: 70px; */
        height: 100%;
        /* opacity: 0.4; */
      }

    .swiper-button-next, .swiper-button-prev {
        color: #000000;
    }

      /* .mySwiper .swiper-slide-thumb-active {
      opacity: 1;
    } */

   .swiper-slide.swiper-slide-visible.swiper-slide-fully-visible {
        
        width: 50px !important;
    }

      .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .big > img {
       height: 435px;
      }

      .small > img {
        height: 50px;
      }
    </style>
  </head>

  <body>
    <!-- Swiper -->
















    
    <div
      style="--swiper-navigation-color: #fff; --swiper-pagination-color: #fff"
      class="swiper mySwiper2"
    >
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <div class="big">
            <img src="./images/book1.jpg" />
          </div>
        </div>
        <div class="swiper-slide">
          <div class="big">
            <img src="./images/book1.jpg" />
          </div>
        </div>
        <div class="swiper-slide">
          <div class="big">
            <img src="./images/book1.jpg" />
          </div>
        </div>
        <div class="swiper-slide">
          <div class="big">
            <img src="./images/book1.jpg" />
          </div>
        </div>
        <div class="swiper-slide">
          <div class="big">
            <img src="./images/book1.jpg" />
          </div>
        </div>
      </div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
    </div>
    <div thumbsSlider="" class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <div class="small">
            <img src="./images/book1.jpg" />
          </div>
        </div>
        <div class="swiper-slide">
          <div class="small">
            <img src="./images/book1.jpg" />
          </div>
        </div>
        <div class="swiper-slide">
          <div class="small">
            <img src="./images/book1.jpg" />
          </div>
        </div>
        <div class="swiper-slide">
          <div class="small">
            <img src="./images/book1.jpg" />
          </div>
        </div>
        <div class="swiper-slide">
          <div class="small">
            <img src="./images/book1.jpg" />
          </div>
        </div>
      </div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
      var swiper = new Swiper(".mySwiper", {
        spaceBetween: 10,
        slidesPerView: 4,
        freeMode: true,
        watchSlidesProgress: true,
      });
      var swiper2 = new Swiper(".mySwiper2", {
        spaceBetween: 10,
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        thumbs: {
          swiper: swiper,
        },
      });
    </script>
  </body>
</html>
