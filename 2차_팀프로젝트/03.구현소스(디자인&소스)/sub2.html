<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saytouche</title>
    <!-- 파비콘 넣기 -->
    <!-- <link rel="shortcut icon" href="./images/favicon.ico" /> -->
    <!-- 폰트어썸 CDN CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
    />
    <!-- 메인 CSS -->
    <link rel="stylesheet" href="./css/sub2.css" />

    <!-- 미디어쿼리는 반드시 일반css아래 위치함! -->
    <link rel="stylesheet" href="./css/media_main.css" />
    <!-- Swiper CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- 제이쿼리 라이브러리 불러오기 
     제이쿼리를 사용하는 JS파일 위에 불러와야한다! -->
    <script src="./js/jquery-3.6.3.min.js"></script>

    <!-- 외부JS 제이쿼리버전 - defer필수! -->
    <script src="./js/main1_jquery.js" defer></script>

    <!-- <script type="module" src="./js/common.js"></script> -->
    <!-- 공통 JS :import 문법을 사용하려면
     반드시 type="module"로 써야한다.-->
    <script type="module" src="./js/common.js"></script>
    <!-- 메인 JS -->
    <script src="./js/sub.js" defer></script>
  </head>
  <body>
    <header class="top">
      <div id="top-area"></div>
    </header>
    <!-- //////////////////////////////////////////////// -->
    <!--2. 메인영역 -->
    <main id="main-area">
      <div class="main-area">
        <h2 class="temp-tit blind">메인영역</h2>

        <!-- 2-1 배너 파트 -->
        <section class="banner-part">
          <h2 class="temp-tit blind">2-1. 배너영역</h2>
          <!-- 배너 스와이퍼 -->
          <div class="banner-swiper-container">
            <div class="swiper bannerSwiper">
              <div class="swiper-wrapper">
                <!-- 슬라이드 1 -->
                <div class="swiper-slide">
                  <div class="banner-box">
                    <img
                      src="./images/rug1.jpg"
                      alt="세이투세 러그 1"
                      class="bg"
                    />
                  </div>
                </div>
                <!-- 슬라이드 2 -->
                <div class="swiper-slide">
                  <div class="banner-box">
                    <img
                      src="./images/rug2.jpg"
                      alt="세이투세 러그 2"
                      class="bg"
                    />
                  </div>
                </div>
                <!-- 슬라이드 3 -->
                <div class="swiper-slide">
                  <div class="banner-box">
                    <img
                      src="./images/rug3.jpg"
                      alt="세이투세 러그 3"
                      class="bg"
                    />
                  </div>
                </div>
                <!-- 슬라이드 4 -->
                <div class="swiper-slide">
                  <div class="banner-box">
                    <img
                      src="./images/rug4.jpg"
                      alt="세이투세 러그 4"
                      class="bg"
                    />
                  </div>
                </div>
                <!-- 슬라이드 5 -->
                <div class="swiper-slide">
                  <div class="banner-box">
                    <img
                      src="./images/rug5.jpg"
                      alt="세이투세 러그 5"
                      class="bg"
                    />
                  </div>
                </div>
              </div>

              <!-- 이전/다음 버튼 -->
              <!-- <div class="swiper-button-prev banner-prev"></div>
            <div class="swiper-button-next banner-next"></div> -->

              <!-- 페이지네이션 -->
              <div class="swiper-pagination banner-pagination"></div>
            </div>
          </div>
        </section>
        <!-- 2-1 배너 파트 끝-->
      </div>
    </main>
    <!-- //////////////////////////////////////////////// -->
    <!-- 6. 하단영역 -->
    <div id="bottom-area"></div>
  </body>
</html>
