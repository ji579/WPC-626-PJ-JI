<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAYTOUCHE - Products</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/8.4.7/swiper-bundle.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 10px;
      font-weight: 300;
      letter-spacing: 2px;
    }

    .category-nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 50px;
      flex-wrap: wrap;
    }

    .category-btn {
      padding: 10px 25px;
      background: white;
      border: 1px solid #ddd;
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 1px;
      transition: all 0.3s;
    }

    .category-btn:hover,
    .category-btn.active {
      background: #333;
      color: white;
      border-color: #333;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
      margin-bottom: 40px;
    }

    .product-card {
      background: white;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-image-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 100%;
      background: #f8f8f8;
      overflow: hidden;
    }

    .swiper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .swiper-slide {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .swiper-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .swiper-pagination {
      bottom: 10px !important;
    }

    .swiper-pagination-bullet {
      background: white;
      opacity: 0.7;
    }

    .swiper-pagination-bullet-active {
      background: white;
      opacity: 1;
    }

    .product-info {
      padding: 20px;
      text-align: center;
    }

    .product-name {
      font-size: 14px;
      margin-bottom: 8px;
      color: #666;
      letter-spacing: 0.5px;
    }

    .product-price {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .product-status {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 12px;
      background: #e0e0e0;
      color: #666;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .loading {
      text-align: center;
      padding: 50px;
      font-size: 18px;
      color: #999;
    }

    @media (max-width: 1200px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }

      h1 {
        font-size: 2rem;
      }

      .category-nav {
        gap: 10px;
      }

      .category-btn {
        padding: 8px 16px;
        font-size: 12px;
      }
    }

    @media (max-width: 480px) {
      .products-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SAYTOUCHE</h1>
    
    <div class="category-nav">
      <button class="category-btn active" data-category="all">ALL</button>
      <button class="category-btn" data-category="edition">EDITION</button>
      <button class="category-btn" data-category="textiles">TEXTILES</button>
      <button class="category-btn" data-category="home">HOME</button>
      <button class="category-btn" data-category="mirror">MIRROR</button>
      <button class="category-btn" data-category="lighting">LIGHTING</button>
      <button class="category-btn" data-category="lifestyle">LIFESTYLE</button>
      <button class="category-btn" data-category="goods">GOODS</button>
    </div>

    <div class="products-grid" id="productsGrid">
      <div class="loading">Loading products...</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/8.4.7/swiper-bundle.min.js"></script>
  <script>
    // 실제로는 JSON 파일에서 불러오지만, 여기서는 예시 데이터 사용
    const productsData = {
      edition: [
        { id: 1, category: "edition", name: "에디션 제품 1", price: "185,000원", images: ["edition_1_01.jpg", "edition_1_02.jpg", "edition_1_03.jpg", "edition_1_04.jpg"], status: "sold out" },
        { id: 2, category: "edition", name: "에디션 제품 2", price: "230,000원", images: ["edition_2_01.jpg", "edition_2_02.jpg", "edition_2_03.jpg", "edition_2_04.jpg"], status: "sold out" },
        { id: 3, category: "edition", name: "에디션 제품 3", price: "230,000원", images: ["edition_3_01.jpg", "edition_3_02.jpg", "edition_3_03.jpg", "edition_3_04.jpg"], status: "sold out" },
        { id: 4, category: "edition", name: "에디션 제품 4", price: "230,000원", images: ["edition_4_01.jpg", "edition_4_02.jpg", "edition_4_03.jpg", "edition_4_04.jpg"], status: "sold out" },
        { id: 5, category: "edition", name: "에디션 제품 5", price: "11,000,000원", images: ["edition_5_01.jpg", "edition_5_02.jpg", "edition_5_03.jpg", "edition_5_04.jpg"], status: "sold out" },
        { id: 6, category: "edition", name: "에디션 제품 6", price: "5,200,000원", images: ["edition_6_01.jpg", "edition_6_02.jpg", "edition_6_03.jpg", "edition_6_04.jpg"], status: "sold out" }
      ],
      textiles: [
        { id: 1, category: "textiles", name: "텍스타일 제품 1", price: "170,000원", images: ["textiles_1_01.jpg", "textiles_1_02.jpg", "textiles_1_03.jpg", "textiles_1_04.jpg"], status: "sold out" },
        { id: 2, category: "textiles", name: "텍스타일 제품 2", price: "55,000원", images: ["textiles_2_01.jpg", "textiles_2_02.jpg", "textiles_2_03.jpg", "textiles_2_04.jpg"], status: "sold out" }
      ],
      home: [
        { id: 1, category: "home", name: "홈데코 제품 1", price: "320,000원", images: ["home_1_01.jpg", "home_1_02.jpg", "home_1_03.jpg", "home_1_04.jpg"], status: "sold out" },
        { id: 2, category: "home", name: "홈데코 제품 2", price: "320,000원", images: ["home_2_01.jpg", "home_2_02.jpg", "home_2_03.jpg", "home_2_04.jpg"], status: "sold out" }
      ],
      mirror: [
        { id: 1, category: "mirror", name: "거울 제품 1", price: "185,000원", images: ["mirror_1_01.jpg", "mirror_1_02.jpg", "mirror_1_03.jpg", "mirror_1_04.jpg"], status: "sold out" }
      ],
      lighting: [
        { id: 1, category: "lighting", name: "조명 제품 1", price: "89,000원", images: ["lighting_1_01.jpg", "lighting_1_02.jpg", "lighting_1_03.jpg", "lighting_1_04.jpg"], status: "sold out" }
      ],
      lifestyle: [
        { id: 1, category: "lifestyle", name: "라이프스타일 제품 1", price: "62,000원", images: ["lifestyle_1_01.jpg", "lifestyle_1_02.jpg", "lifestyle_1_03.jpg", "lifestyle_1_04.jpg"], status: "sold out" }
      ],
      goods: [
        { id: 1, category: "goods", name: "굿즈 제품 1", price: "35,000원", images: ["goods_1_01.jpg", "goods_1_02.jpg", "goods_1_03.jpg", "goods_1_04.jpg"], status: "sold out" }
      ]
    };

    let currentCategory = 'all';
    let swiperInstances = [];

    // 모든 제품 가져오기 (랜덤 섞기)
    function getAllProducts() {
      const allProducts = [];
      Object.keys(productsData).forEach(category => {
        allProducts.push(...productsData[category]);
      });
      return allProducts.sort(() => Math.random() - 0.5);
    }

    // 제품 카드 생성
    function createProductCard(product, index) {
      return `
        <div class="product-card">
          <div class="product-image-wrapper">
            <div class="swiper product-swiper-${index}">
              <div class="swiper-wrapper">
                ${product.images.map(img => `
                  <div class="swiper-slide">
                    <img src="https://via.placeholder.com/400x400/e0e0e0/666666?text=${encodeURIComponent(img)}" alt="${product.name}">
                  </div>
                `).join('')}
              </div>
              <div class="swiper-pagination"></div>
            </div>
          </div>
          <div class="product-info">
            <div class="product-name">${product.name}</div>
            <div class="product-price">${product.price}</div>
            <span class="product-status">${product.status}</span>
          </div>
        </div>
      `;
    }

    // 제품 렌더링
    function renderProducts(category) {
      const grid = document.getElementById('productsGrid');
      
      // 기존 Swiper 인스턴스 제거
      swiperInstances.forEach(swiper => swiper.destroy(true, true));
      swiperInstances = [];

      let products = category === 'all' ? getAllProducts() : productsData[category] || [];
      
      if (products.length === 0) {
        grid.innerHTML = '<div class="loading">No products found</div>';
        return;
      }

      grid.innerHTML = products.map((product, index) => createProductCard(product, index)).join('');

      // Swiper 초기화
      setTimeout(() => {
        products.forEach((_, index) => {
          const swiper = new Swiper(`.product-swiper-${index}`, {
            pagination: {
              el: '.swiper-pagination',
              clickable: true,
            },
            loop: false,
            speed: 300,
          });
          swiperInstances.push(swiper);
        });
      }, 100);
    }

    // 카테고리 버튼 이벤트
    document.querySelectorAll('.category-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        renderProducts(currentCategory);
      });
    });

    // 초기 렌더링
    renderProducts('all');
  </script>
</body>
</html>
